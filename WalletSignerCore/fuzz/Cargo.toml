[package]
name = "locus-wallet-signer-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
locus-wallet-signer-core = { path = ".." }
serde_json = "=1.0.145"

[workspace]
members = ["."]

