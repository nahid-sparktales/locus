[package]
name = "locus-wallet-signer-core"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
alloy = { version = "=2.4.1", default-features = false, features = ["std", "consensus", "eips", "network", "signer-local", "signer-mnemonic", "dyn-abi", "json-abi", "rlp", "serde", "sol-types"] }
bip39 = { version = "=2.2.2", features = ["rand", "zeroize"] }
base64 = "=0.22.1"
bs58 = "=0.5.1"
ed25519-dalek = { version = "=3.0.0", features = ["zeroize"] }
hex = "=0.4.3"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
slip10_ed25519 = "=0.1.3"
solana-pubkey = { version = "=4.3.0", features = ["curve25519", "sha2"] }
sui-crypto = { version = "=0.3.1", features = ["ed25519"] }
sui-sdk-types = "=0.3.2"
zeroize = { version = "=1.9.0", features = ["derive"] }

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = "symbols"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
