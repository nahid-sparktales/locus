name: Locus
options:
  bundleIdPrefix: io.sparktales
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
configs:
  # Two release shapes, because the two channels want opposite things.
  # Release is the direct download: Developer ID signed, notarized, and NOT
  # sandboxed — a container buys nothing outside the App Store and only
  # constrains which workspaces the agent can reach. ReleaseMAS is the App
  # Store build, sandboxed and entitled.
  Debug: debug
  Release: release
  ReleaseMAS: release
settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CURRENT_PROJECT_VERSION: 21
    MARKETING_VERSION: 2.1.0
  configs:
    # A stable signing identity rather than ad-hoc. Keychain items are guarded by
    # an ACL bound to the code signature, and an ad-hoc signature changes on every
    # rebuild, so the Autofill vault key would re-prompt after each build. This
    # touches Debug only — the shipped Release and ReleaseMAS signatures are
    # unchanged. Building outside the team (CI, contributors) works by appending
    # `CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=` to the xcodebuild invocation.
    Debug:
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "Apple Development"
      DEVELOPMENT_TEAM: 4X4RJA7GMD
      ENABLE_APP_SANDBOX: NO
      ENABLE_HARDENED_RUNTIME: NO
    Release:
      ARCHS: arm64
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "Developer ID Application"
      DEVELOPMENT_TEAM: 4X4RJA7GMD
      # A distribution signature must never inherit the development-only
      # debugger entitlement from the local build environment.
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
      ENABLE_APP_SANDBOX: NO
      # Required for notarization, and safe here: every Mach-O in the bundled
      # runtime is signed with this same team, so library validation passes.
      ENABLE_HARDENED_RUNTIME: YES
    ReleaseMAS:
      ARCHS: arm64
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: 4X4RJA7GMD
      # Keep local ReleaseMAS verification faithful to a distribution archive:
      # a development identity must not inject get-task-allow into the sealed
      # bundle merely because App Store distribution signing is unavailable.
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
      ENABLE_APP_SANDBOX: YES
      ENABLE_HARDENED_RUNTIME: YES
packages:
  SwiftMarkdown:
    url: https://github.com/swiftlang/swift-markdown.git
    exactVersion: 0.8.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle.git
    exactVersion: 2.9.6
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    exactVersion: 1.18.0
targetTemplates:
  LocusApplication:
    type: application
    platform: macOS
    sources:
      - path: Locus
        excludes:
          - Resources
      - path: Locus/Resources
        buildPhase: resources
        excludes:
          - ThirdPartyLicenses
      - path: Locus/Resources/ThirdPartyLicenses
        type: folder
        buildPhase: resources
    preBuildScripts:
      - name: Clean stale embedded test bundle
        basedOnDependencyAnalysis: false
        script: |
          "$SRCROOT/Tools/CleanStaleBuildProducts.sh"
    postBuildScripts:
      - name: Build pinned Simulator bridge
        basedOnDependencyAnalysis: false
        script: |
          "$SRCROOT/Tools/BuildSimulatorBridge.sh"
      - name: Bundle local agent runtime
        basedOnDependencyAnalysis: false
        script: |
          "$SRCROOT/Tools/BundleBackend.sh"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.sparktales.locus
        PRODUCT_NAME: Locus
        COMBINE_HIDPI_IMAGES: YES
        # Public identifier for the Locus GitHub App device flow. Both app
        # targets inherit it, so local and distribution builds can connect to
        # the bundled GitHub MCP preset without a developer-only environment.
        LOCUS_GITHUB_OAUTH_CLIENT_ID: Iv23liCL3tit1VOgBjWF
targets:
  WalletRecoveryService:
    type: xpc-service
    platform: macOS
    sources:
      - path: WalletRecoveryService
      - path: Locus/WalletSignerProtocol.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.sparktales.locus.WalletRecovery
        PRODUCT_NAME: WalletRecovery
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: WalletRecoveryService/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/WalletRecovery.entitlements
        ENABLE_APP_SANDBOX: YES
        APPLICATION_EXTENSION_API_ONLY: NO
        SKIP_INSTALL: YES
        ARCHS: arm64
      configs:
        Debug:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Development"
          DEVELOPMENT_TEAM: 4X4RJA7GMD
          ENABLE_HARDENED_RUNTIME: NO
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application"
          DEVELOPMENT_TEAM: 4X4RJA7GMD
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
          ENABLE_HARDENED_RUNTIME: YES
  WalletSignerService:
    type: xpc-service
    platform: macOS
    sources:
      - path: WalletSignerService
      - path: Locus/WalletSignerProtocol.swift
      - path: Locus/WalletNetworkModels.swift
    preBuildScripts:
      - name: Build pinned Rust signer core
        basedOnDependencyAnalysis: false
        script: |
          cargo_bin="${LOCUS_CARGO_BIN:-}"
          if [ -z "$cargo_bin" ]; then
            cargo_bin="$(command -v cargo 2>/dev/null || true)"
          fi
          if [ -z "$cargo_bin" ] && [ -x "$HOME/.cargo/bin/cargo" ]; then
            cargo_bin="$HOME/.cargo/bin/cargo"
          fi
          if [ -z "$cargo_bin" ]; then
            echo "error: Rust Cargo was not found. Install Rust with rustup, or set LOCUS_CARGO_BIN to the cargo executable." >&2
            exit 1
          fi
          cd "$SRCROOT/WalletSignerCore"
          "$cargo_bin" build --release --locked --target aarch64-apple-darwin
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.sparktales.locus.WalletSigner
        PRODUCT_NAME: WalletSigner
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: WalletSignerService/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/WalletSigner.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        ARCHS: arm64
        LIBRARY_SEARCH_PATHS: "$(inherited) $(SRCROOT)/WalletSignerCore/target/aarch64-apple-darwin/release"
        OTHER_LDFLAGS: "$(inherited) -llocus_wallet_signer_core"
        LOCUS_WALLET_CAPABILITY_PUBLIC_KEY: ""
        LOCUS_WALLET_CAPABILITY_MANIFEST_BASE64: ""
        LOCUS_WALLET_REVIEW_MANIFEST_BASE64: ""
      configs:
        Debug:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Development"
          DEVELOPMENT_TEAM: 4X4RJA7GMD
          ENABLE_HARDENED_RUNTIME: NO
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application"
          DEVELOPMENT_TEAM: 4X4RJA7GMD
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
          ENABLE_HARDENED_RUNTIME: YES
  Locus:
    templates:
      - LocusApplication
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Locus/Info.plist
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) LOCUS_DIRECT_DOWNLOAD"
        LOCUS_WALLET_ALCHEMY_ETHEREUM_MAINNET_RPC_URL: ""
        LOCUS_WALLET_QUICKNODE_ETHEREUM_MAINNET_RPC_URL: ""
        LOCUS_WALLET_ALCHEMY_ETHEREUM_SEPOLIA_RPC_URL: ""
        LOCUS_WALLET_QUICKNODE_ETHEREUM_SEPOLIA_RPC_URL: ""
    dependencies:
      - target: WalletRecoveryService
        embed: true
        codeSign: true
      - target: WalletSignerService
        embed: true
        codeSign: true
      - package: Sparkle
      - package: SwiftTerm
      - package: SwiftMarkdown
        product: Markdown
    scheme:
      testTargets:
        - LocusTests
        - LocusUITests
  LocusMAS:
    templates:
      - LocusApplication
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/LocusMAS-Info.plist
        PRODUCT_MODULE_NAME: Locus
      configs:
        ReleaseMAS:
          CODE_SIGN_ENTITLEMENTS: Config/Locus.entitlements
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) LOCUS_APP_STORE"
    dependencies:
      - package: SwiftTerm
      - package: SwiftMarkdown
        product: Markdown
  LocusTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: LocusTests
      - path: ProtocolFixtures/companion-v1.json
        buildPhase: resources
    dependencies:
      - target: Locus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.sparktales.locus.tests
        GENERATE_INFOPLIST_FILE: YES
  LocusWalletChainTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: LocusWalletChainTests
    dependencies:
      - target: Locus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.sparktales.locus.wallet-chain-tests
        GENERATE_INFOPLIST_FILE: YES
        LIBRARY_SEARCH_PATHS: "$(inherited) $(SRCROOT)/WalletSignerCore/target/aarch64-apple-darwin/release"
        OTHER_LDFLAGS: "$(inherited) -llocus_wallet_signer_core"
  LocusUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: LocusUITests
    dependencies:
      - target: Locus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.sparktales.locus.ui-tests
        TEST_TARGET_NAME: Locus
        GENERATE_INFOPLIST_FILE: YES
  LocusMASUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: LocusMASUITests
    dependencies:
      - target: LocusMAS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.sparktales.locus.mas-ui-tests
        TEST_TARGET_NAME: LocusMAS
        GENERATE_INFOPLIST_FILE: YES
schemes:
  WalletChainIntegration:
    build:
      targets:
        Locus: all
        LocusWalletChainTests: [test]
    test:
      config: Debug
      environmentVariables:
        LOCUS_ANVIL_RPC_URL: "$(LOCUS_ANVIL_RPC_URL)"
        LOCUS_ANVIL_VERSION: "$(LOCUS_ANVIL_VERSION)"
      targets:
        - LocusWalletChainTests
  LocusMAS:
    build:
      targets:
        LocusMAS: all
    archive:
      config: ReleaseMAS
    test:
      config: Debug
      targets:
        - LocusMASUITests
