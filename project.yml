name: Locus
options:
  bundleIdPrefix: io.sparktales
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
configs:
  # Two release shapes, because the two channels want opposite things.
  # Release is the direct download: Developer ID signed, notarized, and NOT
  # sandboxed — a container buys nothing outside the App Store and only
  # constrains which workspaces the agent can reach. ReleaseMAS is the App
  # Store build, sandboxed and entitled.
  Debug: debug
  Release: release
  ReleaseMAS: release
settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CURRENT_PROJECT_VERSION: 17
    MARKETING_VERSION: 1.14.0
  configs:
    Debug:
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "-"
      DEVELOPMENT_TEAM: ""
      ENABLE_APP_SANDBOX: NO
      ENABLE_HARDENED_RUNTIME: NO
    Release:
      ARCHS: arm64
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "Developer ID Application"
      DEVELOPMENT_TEAM: 4X4RJA7GMD
      # A distribution signature must never inherit the development-only
      # debugger entitlement from the local build environment.
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
      ENABLE_APP_SANDBOX: NO
      # Required for notarization, and safe here: every Mach-O in the bundled
      # runtime is signed with this same team, so library validation passes.
      ENABLE_HARDENED_RUNTIME: YES
    ReleaseMAS:
      ARCHS: arm64
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: 4X4RJA7GMD
      # Keep local ReleaseMAS verification faithful to a distribution archive:
      # a development identity must not inject get-task-allow into the sealed
      # bundle merely because App Store distribution signing is unavailable.
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
      ENABLE_APP_SANDBOX: YES
      ENABLE_HARDENED_RUNTIME: YES
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle.git
    exactVersion: 2.9.4
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    exactVersion: 1.18.0
targetTemplates:
  LocusApplication:
    type: application
    platform: macOS
    sources:
      - path: Locus
        excludes:
          - Resources
      - path: Locus/Resources
        buildPhase: resources
        excludes:
          - ThirdPartyLicenses
      - path: Locus/Resources/ThirdPartyLicenses
        type: folder
        buildPhase: resources
    preBuildScripts:
      - name: Clean stale embedded test bundle
        basedOnDependencyAnalysis: false
        script: |
          "$SRCROOT/Tools/CleanStaleBuildProducts.sh"
    postBuildScripts:
      - name: Bundle local agent runtime
        basedOnDependencyAnalysis: false
        script: |
          "$SRCROOT/Tools/BundleBackend.sh"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.sparktales.locus
        PRODUCT_NAME: Locus
        COMBINE_HIDPI_IMAGES: YES
targets:
  Locus:
    templates:
      - LocusApplication
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Locus/Info.plist
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) LOCUS_DIRECT_DOWNLOAD"
    dependencies:
      - package: Sparkle
      - package: SwiftTerm
    scheme:
      testTargets:
        - LocusTests
        - LocusUITests
  LocusMAS:
    templates:
      - LocusApplication
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/LocusMAS-Info.plist
        PRODUCT_MODULE_NAME: Locus
      configs:
        ReleaseMAS:
          CODE_SIGN_ENTITLEMENTS: Config/Locus.entitlements
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) LOCUS_APP_STORE"
    dependencies:
      - package: SwiftTerm
  LocusTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: LocusTests
    dependencies:
      - target: Locus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.sparktales.locus.tests
        GENERATE_INFOPLIST_FILE: YES
  LocusUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: LocusUITests
    dependencies:
      - target: Locus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.sparktales.locus.ui-tests
        TEST_TARGET_NAME: Locus
        GENERATE_INFOPLIST_FILE: YES
  LocusMASUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: LocusMASUITests
    dependencies:
      - target: LocusMAS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.sparktales.locus.mas-ui-tests
        TEST_TARGET_NAME: LocusMAS
        GENERATE_INFOPLIST_FILE: YES
schemes:
  LocusMAS:
    build:
      targets:
        LocusMAS: all
    archive:
      config: ReleaseMAS
    test:
      config: Debug
      targets:
        - LocusMASUITests
