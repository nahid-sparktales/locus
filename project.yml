name: Locus
options:
  bundleIdPrefix: io.sparktales
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
configs:
  # Two release shapes, because the two channels want opposite things.
  # Release is the direct download: Developer ID signed, notarized, and NOT
  # sandboxed — a container buys nothing outside the App Store and only
  # constrains which workspaces the agent can reach. ReleaseMAS is the App
  # Store build, sandboxed and entitled.
  Debug: debug
  Release: release
  ReleaseMAS: release
settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CURRENT_PROJECT_VERSION: 11
    MARKETING_VERSION: 1.8.0
  configs:
    Debug:
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "-"
      DEVELOPMENT_TEAM: ""
      ENABLE_APP_SANDBOX: NO
      ENABLE_HARDENED_RUNTIME: NO
    Release:
      ARCHS: arm64
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "Developer ID Application"
      DEVELOPMENT_TEAM: 4X4RJA7GMD
      # A distribution signature must never inherit the development-only
      # debugger entitlement from the local build environment.
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
      ENABLE_APP_SANDBOX: NO
      # Required for notarization, and safe here: every Mach-O in the bundled
      # runtime is signed with this same team, so library validation passes.
      ENABLE_HARDENED_RUNTIME: YES
    ReleaseMAS:
      ARCHS: arm64
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: 4X4RJA7GMD
      ENABLE_APP_SANDBOX: YES
      ENABLE_HARDENED_RUNTIME: YES
targets:
  Locus:
    type: application
    platform: macOS
    sources:
      - path: Locus
        excludes:
          - Resources
      - path: Locus/Resources
        buildPhase: resources
        excludes:
          - ThirdPartyLicenses
      - path: Locus/Resources/ThirdPartyLicenses
        type: folder
        buildPhase: resources
    postBuildScripts:
      - name: Bundle local agent runtime
        basedOnDependencyAnalysis: false
        script: |
          "$SRCROOT/Tools/BundleBackend.sh"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.sparktales.locus
        PRODUCT_NAME: Locus
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Locus
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSDocumentsFolderUsageDescription: "Locus needs access to your Documents folder to open coding workspaces and start the local Ollama agent."
        INFOPLIST_KEY_NSDownloadsFolderUsageDescription: "Locus needs access when you choose files or projects from Downloads."
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 SparkTales Inc."
        COMBINE_HIDPI_IMAGES: YES
      configs:
        ReleaseMAS:
          CODE_SIGN_ENTITLEMENTS: Config/Locus.entitlements
    scheme:
      testTargets:
        - LocusTests
        - LocusUITests
  LocusTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: LocusTests
    dependencies:
      - target: Locus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.sparktales.locus.tests
        GENERATE_INFOPLIST_FILE: YES
  LocusUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: LocusUITests
    dependencies:
      - target: Locus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.sparktales.locus.ui-tests
        TEST_TARGET_NAME: Locus
        GENERATE_INFOPLIST_FILE: YES
