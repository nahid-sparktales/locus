name: Feature request
description: Suggest something Locus should do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: >-
        The situation you are in, not the feature you have in mind. What is
        awkward or impossible today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like to happen
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What you have tried instead
      description: Existing settings, slash commands, or workarounds, and why they fall short.
