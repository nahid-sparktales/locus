name: CI

# A pull request used to be tested twice over: once for the branch push and
# again for the pull_request event, two full suites racing on the same commit.
# That doubled the ui job's exposure to a flaky wait without adding any signal,
# because the pull_request run is the stricter of the pair — it diffs against
# the PR base rather than the previous push. Branches are covered through their
# pull request; main and release tags keep their own runs, and a branch without
# a pull request can still be run by hand.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Only superseded PR revisions cancel one another. Protected branch/tag and
# manually dispatched checks retain distinct run IDs and are never preempted.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  wallet-signer:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # gitleaks walks commit history; on a shallow clone it degrades to a
          # current-tree scan and never sees a secret committed and removed
          # within a PR's commit series — which still lands in public history.
          fetch-depth: 0
      - name: Install reviewed wallet JavaScript toolchain
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.20.0'
          check-latest: false
          package-manager-cache: false
      - name: Install reviewed wallet npm resolver
        run: |
          npm install --prefix "$RUNNER_TEMP/locus-wallet-npm" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org npm@11.8.0
          echo "$RUNNER_TEMP/locus-wallet-npm/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Verify exact wallet JavaScript toolchain
        run: |
          node --version
          npm --version
          test "$(node --version)" = "v24.20.0"
          test "$(npm --version)" = "11.8.0"
      - name: Locked dependency, license, and SBOM gate
        run: python3 Tools/WalletSignerSBOM.py WalletSignerCore "$RUNNER_TEMP/WalletSignerSBOM.cdx.json"
      - name: Wallet connection SDK provenance and activation gate
        run: >-
          python3 Tools/WalletConnectionsSBOM.py
          Locus.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          project.yml
          "$RUNNER_TEMP/WalletConnectionsSBOM.cdx.json"
      - name: Wallet review manifest signing boundary
        run: Tools/TestWalletReviewManifestTool.sh
      - name: Wallet capability evidence and signing boundary
        run: Tools/TestWalletCapabilityManifestTool.sh
      - name: Deterministic wallet connector bundle and advisory gate
        working-directory: WalletConnectionsWeb
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit --audit-level=high
          npm --ignore-scripts run build
          git diff --exit-code -- ../WalletConnectionsRuntime/Resources/WalletConnections.bundle.js
      - name: Rust advisory audit
        working-directory: WalletSignerCore
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit
      - name: Rust formatting, lint, and tests
        working-directory: WalletSignerCore
        run: |
          rustup component add rustfmt clippy
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Deterministic Rust wallet fuzz-smoke
        working-directory: WalletSignerCore
        run: cargo test --locked fuzz_smoke_mutated_ffi_corpora_always_return_bounded_json
      - name: Repository secret scan
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          case "$(uname -m)" in
            arm64)
              asset="gitleaks_${GITLEAKS_VERSION}_darwin_arm64.tar.gz"
              expected="b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5"
              ;;
            x86_64)
              asset="gitleaks_${GITLEAKS_VERSION}_darwin_x64.tar.gz"
              expected="dfe101a4db2255fc85120ac7f3d25e4342c3c20cf749f2c20a18081af1952709"
              ;;
            *)
              echo "Unsupported CI architecture" >&2
              exit 1
              ;;
          esac
          gitleaks_dir="$RUNNER_TEMP/gitleaks-${GITLEAKS_VERSION}"
          mkdir -p "$gitleaks_dir"
          curl -fL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${asset}" \
            -o "$gitleaks_dir/$asset"
          actual="$(shasum -a 256 "$gitleaks_dir/$asset" | awk '{print $1}')"
          test "$actual" = "$expected"
          tar -xzf "$gitleaks_dir/$asset" -C "$gitleaks_dir"
          "$gitleaks_dir/gitleaks" git --no-banner --redact --config .gitleaks.toml .

  python:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Reviewability report (advisory)
        env:
          LOCUS_REVIEW_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 Tools/ReviewabilityReport.py
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - run: python -m pip install -e './agent[dev]'
      - run: python -m ruff check agent Tools/ReviewabilityReport.py
      - run: python -m pytest -q
      - run: python -m pip_audit -r agent/requirements-runtime.lock --disable-pip --no-deps
      - name: Release script syntax
        run: |
          for release_script in Tools/*.sh agent/run.sh; do
            zsh -n "$release_script" || exit "$?"
          done

  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # ripgrep is what the design-system audit greps with. Without it that
      # step found nothing, reported success, and checked nothing at all.
      - run: brew install xcodegen ripgrep
      - run: xcodegen generate
      - name: Generated project is current
        run: git diff --exit-code -- Locus.xcodeproj/project.pbxproj
      - name: Design-system source audit
        run: Tools/AuditDesignSystem.sh
      - name: Protocol manifest is current
        run: python3 Tools/ProtocolManifest.py
      - name: Shared wire types still compile for iOS
        # The iOS companion vendors these files byte-for-byte and cannot edit
        # them, so prove here that they build for iOS before any sync happens.
        run: >-
          xcrun swiftc -typecheck
          -sdk "$(xcrun --sdk iphoneos --show-sdk-path)"
          -target arm64-apple-ios18.0
          -swift-version 5
          Locus/CompanionWireTypes.swift
          Locus/JSONValue.swift
      - name: Swift unit tests
        env:
          LOCUS_BUNDLE_MODE: skip
        run: >-
          xcodebuild test
          -project Locus.xcodeproj
          -scheme Locus
          -configuration Debug
          -destination 'platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/locus-debug-tests"
          -only-testing:LocusTests
          CODE_SIGN_IDENTITY=-
          DEVELOPMENT_TEAM=
          LOCUS_WALLET_SIGNER_ENTITLEMENTS=Config/WalletSignerAdHoc.entitlements
          LOCUS_DIRECT_ENTITLEMENTS=Config/LocusDirectAdHoc.entitlements
      - name: Deterministic Swift wallet fuzz-smoke
        env:
          LOCUS_BUNDLE_MODE: skip
        run: >-
          xcodebuild test-without-building
          -project Locus.xcodeproj
          -scheme Locus
          -configuration Debug
          -destination 'platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/locus-debug-tests"
          -only-testing:LocusTests/WalletDecoderFuzzTests
      - name: Pinned Anvil wallet-chain integration
        env:
          FOUNDRY_VERSION: v1.7.1
        run: |
          case "$(uname -m)" in
            arm64)
              asset="foundry_${FOUNDRY_VERSION}_darwin_arm64.tar.gz"
              expected="eacdc67718fac857cad9e19c7f6729dd80de731d09df81856391d093cfcab547"
              ;;
            x86_64)
              asset="foundry_${FOUNDRY_VERSION}_darwin_amd64.tar.gz"
              expected="c7fd1f5c9bf718d30b5cb6fc94eac605039de2aa50afc4c545a4dddc1e411acb"
              ;;
            *)
              echo "Unsupported CI architecture" >&2
              exit 1
              ;;
          esac
          foundry_dir="$RUNNER_TEMP/foundry-${FOUNDRY_VERSION}"
          mkdir -p "$foundry_dir"
          curl -fL \
            "https://github.com/foundry-rs/foundry/releases/download/${FOUNDRY_VERSION}/${asset}" \
            -o "$foundry_dir/$asset"
          actual="$(shasum -a 256 "$foundry_dir/$asset" | awk '{print $1}')"
          test "$actual" = "$expected"
          tar -xzf "$foundry_dir/$asset" -C "$foundry_dir"
          LOCUS_ANVIL_BIN="$foundry_dir/anvil" Tools/RunWalletChainTests.sh \
            -derivedDataPath "$RUNNER_TEMP/locus-debug-anvil" \
            CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            LOCUS_WALLET_SIGNER_ENTITLEMENTS=Config/WalletSignerAdHoc.entitlements \
            LOCUS_DIRECT_ENTITLEMENTS=Config/LocusDirectAdHoc.entitlements
      - name: Pinned Solana local-validator integration
        env:
          AGAVE_VERSION: v4.1.2
        run: |
          case "$(uname -m)" in
            arm64)
              asset="solana-release-aarch64-apple-darwin.tar.bz2"
              expected="51a44318e6fb8be0cfa69cdfdb3252f4c76a5eb2866740694e91de3d2fc5a75b"
              ;;
            x86_64)
              asset="solana-release-x86_64-apple-darwin.tar.bz2"
              expected="eb678fe505ca470d4b474a0a92a1d6dd6c00c95df47ee4d8ca0712fe7a97efa1"
              ;;
            *)
              echo "Unsupported CI architecture" >&2
              exit 1
              ;;
          esac
          agave_dir="$RUNNER_TEMP/agave-${AGAVE_VERSION}"
          mkdir -p "$agave_dir"
          curl -fL \
            "https://github.com/anza-xyz/agave/releases/download/${AGAVE_VERSION}/${asset}" \
            -o "$agave_dir/$asset"
          actual="$(shasum -a 256 "$agave_dir/$asset" | awk '{print $1}')"
          test "$actual" = "$expected"
          tar -xjf "$agave_dir/$asset" -C "$agave_dir"
          LOCUS_SOLANA_TEST_VALIDATOR_BIN="$agave_dir/solana-release/bin/solana-test-validator" \
            Tools/RunWalletSolanaTests.sh \
            -derivedDataPath "$RUNNER_TEMP/locus-debug-solana" \
            CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            LOCUS_WALLET_SIGNER_ENTITLEMENTS=Config/WalletSignerAdHoc.entitlements \
            LOCUS_DIRECT_ENTITLEMENTS=Config/LocusDirectAdHoc.entitlements
      - name: Pinned Sui GraphQL localnet integration
        run: |
          brew install postgresql@17
          export PATH="$(brew --prefix postgresql@17)/bin:$PATH"
          Tools/RunWalletSuiTests.sh \
            -derivedDataPath "$RUNNER_TEMP/locus-debug-sui" \
            CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            LOCUS_WALLET_SIGNER_ENTITLEMENTS=Config/WalletSignerAdHoc.entitlements \
            LOCUS_DIRECT_ENTITLEMENTS=Config/LocusDirectAdHoc.entitlements
      - name: Direct and App Store release configurations compile
        env:
          LOCUS_BUNDLE_MODE: skip
        run: |
          xcodebuild build \
            -project Locus.xcodeproj \
            -scheme Locus \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/locus-release-direct" \
            CODE_SIGNING_ALLOWED=NO
          xcodebuild build \
            -project Locus.xcodeproj \
            -scheme LocusMAS \
            -configuration ReleaseMAS \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/locus-release-mas" \
            CODE_SIGNING_ALLOWED=NO

          direct="$RUNNER_TEMP/locus-release-direct/Build/Products/Release/Locus.app"
          app_store="$RUNNER_TEMP/locus-release-mas/Build/Products/ReleaseMAS/Locus.app"
          umask 077
          release_inspection_dir="$(mktemp -d "$RUNNER_TEMP/locus-release-inspection.XXXXXX")"
          trap 'find "$release_inspection_dir" -depth -delete' EXIT
          # BEGIN release_audit_output
          release_audit_output() {
            local expectation="$1" pattern="$2"
            shift 2
            local inspection="$release_inspection_dir/inspection.stdout"
            if ! "$@" > "$inspection" 2>/dev/null; then
              echo 'error: release inspection producer failed' >&2
              return 1
            fi
            local match_status=0
            grep -E -- "$pattern" "$inspection" >/dev/null || match_status=$?
            if [[ "$expectation" == present && "$match_status" == 0 ]] ||
               [[ "$expectation" == absent && "$match_status" == 1 ]]; then
              return 0
            fi
            echo 'error: release inspection did not satisfy the required boundary' >&2
            return 1
          }
          # END release_audit_output
          Tools/AuditWalletBuildBoundary.sh "$direct" "$app_store"
          test -x "$direct/Contents/XPCServices/WalletSigner.xpc/Contents/MacOS/WalletSigner"
          test ! -e "$direct/Contents/XPCServices/WalletConnections.xpc"
          test -f "$direct/Contents/Resources/WalletConnections.bundle.js"
          test "$(shasum -a 256 "$direct/Contents/Resources/WalletConnections.bundle.js" | awk '{print $1}')" = \
            '09aa8643956ae5e17ab004ccd85b62811a36f7f4e44535d2659ef43e512323bf'
          test -f "$direct/Contents/Resources/WalletConnectionsNotices.md"
          grep -Fq 'Portions © 2025 Reown, Inc. All Rights Reserved' \
            "$direct/Contents/Resources/WalletConnectionsNotices.md"
          test "$(shasum -a 256 "$direct/Contents/Resources/LICENSE" | awk '{print $1}')" = \
            'e30bbba6782f025ba0b6ced7d36840ac8587073d8df06a21be369a5cfcfc5830'
          test -x "$direct/Contents/Helpers/WalletRecovery.app/Contents/MacOS/WalletRecovery"
          test -x "$direct/Contents/Helpers/WalletRecovery.app/Contents/XPCServices/WalletSigner.xpc/Contents/MacOS/WalletSigner"
          cmp "$direct/Contents/XPCServices/WalletSigner.xpc/Contents/MacOS/WalletSigner" \
            "$direct/Contents/Helpers/WalletRecovery.app/Contents/XPCServices/WalletSigner.xpc/Contents/MacOS/WalletSigner"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSUIElement' \
            "$direct/Contents/Helpers/WalletRecovery.app/Contents/Info.plist")" = 'true'
          Tools/AuditWalletSignerBinary.sh \
            "$direct/Contents/XPCServices/WalletSigner.xpc/Contents/MacOS/WalletSigner"
          Tools/AuditWalletSignerBinary.sh \
            "$direct/Contents/Helpers/WalletRecovery.app/Contents/XPCServices/WalletSigner.xpc/Contents/MacOS/WalletSigner"
          test ! -e "$app_store/Contents/XPCServices/WalletSigner.xpc"
          test ! -e "$app_store/Contents/XPCServices/WalletConnections.xpc"
          test ! -e "$app_store/Contents/Resources/WalletConnections.bundle.js"
          test ! -e "$app_store/Contents/Resources/WalletConnectionsNotices.md"
          test ! -e "$app_store/Contents/Resources/LICENSE"
          test -z "$(find "$app_store/Contents/Resources" -name 'LocusReownSwift_*' -print -quit)"
          release_audit_output absent 'LocusWalletConnectPrivateBindingsV1' \
            /usr/bin/strings "$app_store/Contents/MacOS/Locus"
          test ! -e "$app_store/Contents/Helpers/WalletRecovery.app"
          test -d "$direct/Contents/Frameworks/Sparkle.framework"
          test ! -e "$app_store/Contents/Frameworks/Sparkle.framework"
          test "$(/usr/libexec/PlistBuddy -c 'Print :SUFeedURL' "$direct/Contents/Info.plist")" = \
            'https://github.com/nahid-sparktales/locus/releases/latest/download/appcast.xml'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
            "$direct/Contents/Frameworks/Sparkle.framework/Resources/Info.plist")" = '2.9.6'
          release_audit_output present 'Sparkle.framework' /usr/bin/otool -L "$direct/Contents/MacOS/Locus"
          release_audit_output absent 'Sparkle.framework' /usr/bin/otool -L "$app_store/Contents/MacOS/Locus"
          release_audit_output absent '^  "SU[^" ]*"' /usr/bin/plutil -p "$app_store/Contents/Info.plist"
          test -z "$(find "$app_store/Contents" \
            \( -name Updater.app -o -name Autoupdate -o -name Downloader.xpc -o -name Installer.xpc \) \
            -print -quit)"
      - name: Retain native and local-chain result bundles on success or failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: locus-native-chain-macos15-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          # xcodebuild's generated test bundles, including failure geometry and
          # attachments. Never upload whole DerivedData or bundled runtimes.
          path: |
            ${{ runner.temp }}/locus-debug-tests/Logs/Test/*.xcresult/**
            ${{ runner.temp }}/locus-debug-anvil/Logs/Test/*.xcresult/**
            ${{ runner.temp }}/locus-debug-solana/Logs/Test/*.xcresult/**
            ${{ runner.temp }}/locus-debug-sui/Logs/Test/*.xcresult/**
          if-no-files-found: error
          retention-days: 90

  mobile:
    runs-on: macos-15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - run: flutter pub get
      - name: Flutter format
        run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - name: Android debug build
        run: flutter build apk --debug
      - name: Unsigned iOS simulator build
        run: flutter build ios --simulator --no-codesign

  ui:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Generated project is current
        run: git diff --exit-code -- Locus.xcodeproj/project.pbxproj
      - name: Serialized full UI suite with exact native profile accounting
        env:
          LOCUS_BUNDLE_MODE: skip
        run: >-
          python3 Tools/RunLocusUIMatrix.py
          --os-major 15
          --native-profile compact-light
          --derived-data "$RUNNER_TEMP/locus-ui-derived"
          --output "$RUNNER_TEMP/locus-ui-evidence"
      - name: Retain requested IDs, exact counts, screenshots, and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: locus-ui-macos15-compact-light-native-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/locus-ui-evidence
          if-no-files-found: error
          retention-days: 90
