name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - run: python -m pip install -e './agent[dev]'
      - run: python -m ruff check agent
      - run: python -m pytest -q
      - run: python -m pip_audit -r agent/requirements-runtime.lock --disable-pip --no-deps
      - name: Release script syntax
        run: zsh -n Tools/*.sh agent/run.sh

  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Generated project is current
        run: git diff --exit-code -- Locus.xcodeproj/project.pbxproj
      - name: Swift unit tests
        env:
          LOCUS_BUNDLE_MODE: skip
        run: >-
          xcodebuild test
          -project Locus.xcodeproj
          -scheme Locus
          -configuration Debug
          -destination 'platform=macOS'
          -only-testing:LocusTests
      - name: Direct and App Store release configurations compile
        env:
          LOCUS_BUNDLE_MODE: skip
        run: |
          for configuration in Release ReleaseMAS; do
            xcodebuild build \
              -project Locus.xcodeproj \
              -scheme Locus \
              -configuration "$configuration" \
              -destination 'generic/platform=macOS' \
              CODE_SIGNING_ALLOWED=NO
          done

  ui:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Generated project is current
        run: git diff --exit-code -- Locus.xcodeproj/project.pbxproj
      - name: Accessibility and keyboard UI tests
        env:
          LOCUS_BUNDLE_MODE: skip
        run: >-
          xcodebuild test
          -project Locus.xcodeproj
          -scheme Locus
          -configuration Debug
          -destination 'platform=macOS'
          -only-testing:LocusUITests
