name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - run: python -m pip install -e './agent[dev]'
      - run: python -m ruff check agent
      - run: python -m pytest -q
      - run: python -m pip_audit -r agent/requirements-runtime.lock --disable-pip --no-deps
      - name: Release script syntax
        run: zsh -n Tools/*.sh agent/run.sh

  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Generated project is current
        run: git diff --exit-code -- Locus.xcodeproj/project.pbxproj
      - name: Design-system source audit
        run: Tools/AuditDesignSystem.sh
      - name: Protocol manifest is current
        run: python3 Tools/ProtocolManifest.py
      - name: Shared wire types still compile for iOS
        # The iOS companion vendors these files byte-for-byte and cannot edit
        # them, so prove here that they build for iOS before any sync happens.
        run: >-
          xcrun swiftc -typecheck
          -sdk "$(xcrun --sdk iphoneos --show-sdk-path)"
          -target arm64-apple-ios18.0
          -swift-version 5
          Locus/CompanionWireTypes.swift
          Locus/JSONValue.swift
      - name: Swift unit tests
        env:
          LOCUS_BUNDLE_MODE: skip
        run: >-
          xcodebuild test
          -project Locus.xcodeproj
          -scheme Locus
          -configuration Debug
          -destination 'platform=macOS'
          -only-testing:LocusTests
      - name: Direct and App Store release configurations compile
        env:
          LOCUS_BUNDLE_MODE: skip
        run: |
          build_root="$RUNNER_TEMP/locus-release-builds"
          xcodebuild build \
            -project Locus.xcodeproj \
            -scheme Locus \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$build_root" \
            CODE_SIGNING_ALLOWED=NO
          xcodebuild build \
            -project Locus.xcodeproj \
            -scheme LocusMAS \
            -configuration ReleaseMAS \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$build_root" \
            CODE_SIGNING_ALLOWED=NO

          direct="$build_root/Build/Products/Release/Locus.app"
          app_store="$build_root/Build/Products/ReleaseMAS/Locus.app"
          test -d "$direct/Contents/Frameworks/Sparkle.framework"
          test ! -e "$app_store/Contents/Frameworks/Sparkle.framework"
          test "$(/usr/libexec/PlistBuddy -c 'Print :SUFeedURL' "$direct/Contents/Info.plist")" = \
            'https://github.com/nahid-sparktales/locus/releases/latest/download/appcast.xml'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
            "$direct/Contents/Frameworks/Sparkle.framework/Resources/Info.plist")" = '2.9.4'
          /usr/bin/otool -L "$direct/Contents/MacOS/Locus" | grep -q 'Sparkle.framework'
          ! /usr/bin/otool -L "$app_store/Contents/MacOS/Locus" | grep -q 'Sparkle.framework'
          ! /usr/bin/plutil -p "$app_store/Contents/Info.plist" | grep -Eq '^  "SU[^" ]*"'
          test -z "$(find "$app_store/Contents" \
            \( -name Updater.app -o -name Autoupdate -o -name Downloader.xpc -o -name Installer.xpc \) \
            -print -quit)"

  mobile:
    runs-on: macos-15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - run: flutter pub get
      - name: Flutter format
        run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - name: Android debug build
        run: flutter build apk --debug
      - name: Unsigned iOS simulator build
        run: flutter build ios --simulator --no-codesign

  ui:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Generated project is current
        run: git diff --exit-code -- Locus.xcodeproj/project.pbxproj
      - name: Accessibility and keyboard UI tests
        env:
          LOCUS_BUNDLE_MODE: skip
        run: >-
          xcodebuild test
          -project Locus.xcodeproj
          -scheme Locus
          -configuration Debug
          -destination 'platform=macOS'
          -only-testing:LocusUITests
