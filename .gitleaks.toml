title = "Locus secret scanning"

[extend]
useDefault = true

[[allowlists]]
description = "The Ollama context budget constant is not an API token"
condition = "AND"
regexTarget = "line"
paths = ['''(^|/)agent/ollama_code/core\.py$''']
regexes = ['''headroom_tokens\s*=\s*RESERVED_REPLY_TOKENS''']

[[allowlists]]
description = """
The Locus GitHub App client ID is a public identifier, not a credential.
GitHub App client IDs are published on the app's own settings page and are
required in the OAuth device flow, which is designed for public clients that
cannot hold a secret. No GitHub client secret is embedded anywhere in this
repository. Matched by generic-api-key on entropy plus the "auth" substring in
LOCUS_GITHUB_OAUTH_CLIENT_ID.
"""
regexes = ['''Iv23liCL3tit1VOgBjWF''']

[[allowlists]]
description = "The Alchemy API-key path validation checks a variable, not a credential"
condition = "AND"
regexTarget = "line"
paths = ['''(^|/)Locus/WalletRPCClient\.swift$''']
regexes = ['''guard !apiKey\.isEmpty, apiKey\.utf8\.count <= 512,''']

[[allowlists]]
description = "The wallet review test accepts an in-memory private-key value, not a credential"
condition = "AND"
regexTarget = "line"
paths = ['''(^|/)LocusTests/WalletGatewayTests\.swift$''']
regexes = ['''key: Curve25519\.Signing\.PrivateKey''']

[[allowlists]]
description = "Reown's Curve25519 property declarations are types, not embedded private keys"
condition = "AND"
regexTarget = "line"
paths = ['''^Vendor/ReownSwift/Sources/WalletConnectKMS/Crypto/CryptoKitWrapper/(SigningKeyCryptoKit|AgreementCryptoKit)\.swift$''']
regexes = ['''^\s*private let key: Curve25519\.(Signing|KeyAgreement)\.PrivateKey\s*$''']

[[allowlists]]
description = "The connection manifest test accepts an in-memory signing-key parameter"
condition = "AND"
regexTarget = "line"
paths = ['''^LocusTests/WalletConnectionTests\.swift$''']
regexes = ['''^\s*key: Curve25519\.Signing\.PrivateKey\s*$''']
