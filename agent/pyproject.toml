[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ollama-code"
version = "0.3.0"
description = "A local coding agent powered by Ollama, with a CLI and the REST/WebSocket service behind Locus for macOS."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "rich>=13.7",
    "prompt_toolkit>=3.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
ollama-code = "ollama_code.app:main"
ollama-code-server = "ollama_code.server:main"

[tool.setuptools.packages.find]
include = ["ollama_code*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
